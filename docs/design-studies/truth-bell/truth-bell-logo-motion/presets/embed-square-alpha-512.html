<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truth Bell Obsidian S1 — 512x512 Transparent Squircle Badge</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
      }
      #embed-root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div
      id="embed-root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="512"
      data-height="512"
      data-fps="60"
    >
      <div
        data-composition-id="truth-bell-hero"
        data-composition-src="compositions/truth-bell-hero.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="512"
        data-height="512"
        data-variable-values='{"theme":"obsidian","vessel":"badge","wordmark":"none","canvasWidth":512,"canvasHeight":512,"settledScale":512,"clipDuration":4,"alphaBg":true,"lensClip":true}'
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
