      const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
      const lerp = (a, b, t) => a + (b - a) * t;
      const smoothstep = (e0, e1, x) => {

      const smootherstep = (e0, e1, x) => {

      const easeInOutQuart = (x) => {

      const cubicBezier = (x1, y1, x2, y2) => (x) => {
        const tIn = clamp01(x);
        if (tIn <= 0) return 0;
        if (tIn >= 1) return 1;
        const cx = 3 * x1;
        const bx = 3 * (x2 - x1) - cx;
        const ax = 1 - cx - bx;
        const cy = 3 * y1;
        const by = 3 * (y2 - y1) - cy;
        const ay = 1 - cy - by;
        let u = tIn;
        for (let i = 0; i < 6; i++) {
          const xu = ((ax * u + bx) * u + cx) * u - tIn;
          const dxu = (3 * ax * u + 2 * bx) * u + cx;
          if (Math.abs(xu) < 1e-6) break;
          if (Math.abs(dxu) > 1e-6) u -= xu / dxu;

        u = clamp01(u);
        return ((ay * u + by) * u + cy) * u;

      const easeSnapOut = cubicBezier(0.10, 0.96, 0.22, 1.0);
      const easeWhipSlide = cubicBezier(0.46, 0.02, 0.08, 1.0);

      function integrateProfileLut(steps, speedFn) {
        const pos = new Float32Array(steps + 1);
        const vel = new Float32Array(steps + 1);
        let acc = 0;
        let prev = speedFn(0);
        vel[0] = prev;
        for (let i = 1; i <= steps; i++) {
          const x = i / steps;
          const cur = speedFn(x);
          acc += 0.5 * (prev + cur) / steps;
          pos[i] = acc;
          vel[i] = cur;
          prev = cur;
        }
        const inv = acc > 1e-8 ? 1 / acc : 1;
        for (let i = 0; i <= steps; i++) {
          pos[i] *= inv;
          vel[i] *= inv;
        }
        return (xIn) => {
          const x = clamp01(xIn);
          const f = x * steps;
          const i0 = Math.min(steps - 1, Math.floor(f));
          const frac = f - i0;
          return {
            u: lerp(pos[i0], pos[i0 + 1], frac),
            v: lerp(vel[i0], vel[i0 + 1], frac)
          };

      function evalRibbonCenter(t) {
        const a = -2.2 + 4.6 * t;
        const x = 270 + 200 * Math.cos(a) - 175 * t * t * t;
        const y = 145 + 280 * (3 * t * t - 2 * t * t * t) + 1.4049;
        const dx = -920 * Math.sin(a) - 525 * t * t;
        const dy = 1680 * t * (1 - t);
        const len = Math.hypot(dx, dy) || 1;

      function evalRibbonBreadth(t) {
        const s = Math.sin(Math.PI * t);

          34 -
          5 * s * s +
          60 * Math.pow(t, 3) +
          7 * Math.pow(t, 5) +
          6 * Math.exp(-Math.pow((t - 0.77) / 0.17, 2))

      }

      function lowerLeftFadeAlpha(nx, ny) {
        if (ny <= 266) return 1.0;
        const yInfl = smoothstep(266, 326, ny);
        const dx = 24 - 195;
        const dy = 418 - 365;
        const lenSq = dx * dx + dy * dy;
        const proj = ((nx - 195) * dx + (ny - 365) * dy) / lenSq;
        if (proj <= 0) return 1.0;
        const keepX = proj >= 1 ? 0 : Math.pow(1 - smoothstep(0, 1, proj), 1.6);
        return 1 - yInfl * (1 - keepX);

      function applyLowerLeftFadeCanvas(canvas) {

          for (let px = 0; px < size; px++) {
            const nx = (px + 0.5) * scale;

            if (k < 1) {

      function buildRibbonFieldBuffer(size = 1024) {
        const N = 480;
        const pts = [];
        for (let i = 0; i <= N; i++) {
          const t = 1.04 * (i / N);
          const c = evalRibbonCenter(t);
          const b = evalRibbonBreadth(clamp01(t));
          pts.push({ t, x: c.x, y: c.y, hw: b * 0.5 });
        }

        const totalPx = size * size;
        const minDist2 = new Float32Array(totalPx);
        const bestU = new Float32Array(totalPx);
        minDist2.fill(1e12);

        const pxPer512 = size / 512;
        const invScale = 512 / size;
        const PAD = 24;

        for (let i = 0; i < N; i++) {
          const p0 = pts[i];
          const p1 = pts[i + 1];
          const hwMax = Math.max(p0.hw, p1.hw) + PAD;
          const minX512 = Math.min(p0.x, p1.x) - hwMax;
          const maxX512 = Math.max(p0.x, p1.x) + hwMax;
          const minY512 = Math.min(p0.y, p1.y) - hwMax;
          const maxY512 = Math.max(p0.y, p1.y) + hwMax;

          const xStart = Math.max(0, Math.floor(minX512 * pxPer512));
          const xEnd = Math.min(size - 1, Math.ceil(maxX512 * pxPer512));
          const yStart = Math.max(0, Math.floor(minY512 * pxPer512));
          const yEnd = Math.min(size - 1, Math.ceil(maxY512 * pxPer512));

          const sx = p1.x - p0.x;
          const sy = p1.y - p0.y;
          const segLen2 = sx * sx + sy * sy || 1e-9;

          for (let py = yStart; py <= yEnd; py++) {
            const y512 = (py + 0.5) * invScale;
            const relY = y512 - p0.y;
            const rowOff = py * size;
            for (let px = xStart; px <= xEnd; px++) {
              const x512 = (px + 0.5) * invScale;
              const relX = x512 - p0.x;
              const rawFrac = (relX * sx + relY * sy) / segLen2;
              const frac = rawFrac < 0 ? 0 : rawFrac > 1 ? 1 : rawFrac;
              const dx = relX - sx * frac;
              const dy = relY - sy * frac;
              const dist2 = dx * dx + dy * dy;

              const idx = rowOff + px;
              if (dist2 < minDist2[idx]) {
                minDist2[idx] = dist2;
                bestU[idx] = p0.t + (p1.t - p0.t) * frac;
              }
            }
          }
        }

        function centerDist2(t, x512, y512) {
          const a = -2.2 + 4.6 * t;
          const t2 = t * t;
          const cx = 270 + 200 * Math.cos(a) - 175 * t2 * t;
          const cy = 145 + 280 * (3 * t2 - 2 * t2 * t) + 1.4049;
          const dx = x512 - cx;
          const dy = y512 - cy;
          return dx * dx + dy * dy;
        }

        const duHalf = 2.0 * (1.04 / N);
        const PHI = 0.6180339887498949;
        const c0 = evalRibbonCenter(0);
        const hw0 = evalRibbonBreadth(0) * 0.5;
        const rCap = 4.2;
        const out = new Uint16Array(totalPx * 4);
        const f32 = new Float32Array(1);
        const u32 = new Uint32Array(f32.buffer);
        function floatToHalf(val) {
          f32[0] = val;
          const x = u32[0];
          const bits = (x >>> 16) & 0x8000;
          const e = (x >>> 23) & 0xff;
          if (e === 255) return bits | 0x7c00;
          const halfExp = e - 127 + 15;
          if (halfExp <= 0) {
            if (halfExp < -10) return bits;
            const m = ((x & 0x7fffff) | 0x800000) >>> (1 - halfExp);
            return bits | ((m + 0x1000) >>> 13);
          }
          if (halfExp >= 31) return bits | 0x7bff;
          const mRound = (x & 0x7fffff) + 0x1000;
          if (mRound & 0x800000) return bits | ((halfExp + 1) << 10);
          return bits | (halfExp << 10) | (mRound >>> 13);
        }
        const zeroHalf = floatToHalf(0);
        const halfNegOne = floatToHalf(0);
        for (let py = 0; py < size; py++) {
          const y512 = (py + 0.5) * invScale;
          for (let px = 0; px < size; px++) {
            const x512 = (px + 0.5) * invScale;
            const idx = py * size + px;
            const o = idx * 4;
            if (minDist2[idx] >= 1e11) {
              out[o] = zeroHalf;
              out[o + 1] = zeroHalf;
              out[o + 2] = 0x3800; // 0.5 -> bnx = 0
              out[o + 3] = halfNegOne; // 0.0 -> bny = -1
              continue;
            }

            let a = Math.max(0, bestU[idx] - duHalf);
            let b = Math.min(1.04, bestU[idx] + duHalf);
            let x1 = b - PHI * (b - a);
            let x2 = a + PHI * (b - a);
            let f1 = centerDist2(x1, x512, y512);
            let f2 = centerDist2(x2, x512, y512);
            for (let step = 0; step < 6; step++) {
              if (f1 < f2) {
                b = x2; x2 = x1; f2 = f1;
                x1 = b - PHI * (b - a);
                f1 = centerDist2(x1, x512, y512);
              } else {
                a = x1; x1 = x2; f1 = f2;
                x2 = a + PHI * (b - a);
                f2 = centerDist2(x2, x512, y512);
              }
            }
            const u = 0.5 * (a + b);
            const c = evalRibbonCenter(u);
            const hw = evalRibbonBreadth(clamp01(u)) * 0.5;
            const rxC = x512 - c.x;
            const ryC = y512 - c.y;
            let sdf = Math.hypot(rxC, ryC) - hw;
            const signedLat = rxC * c.nx + ryC * c.ny;

            // Smooth analytical outward bevel normal (zero polyline wedges or quantization noise)
            const sgnLat = signedLat / Math.hypot(signedLat, 3.0);
            let bnx = c.nx * sgnLat;
            let bny = c.ny * sgnLat;

            // Match exact flat square-rounded cap at u = 0
            if (u < 0.03) {
              const rx = x512 - c0.x;
              const ry = y512 - c0.y;
              const axAlong = rx * c0.tx + ry * c0.ty;
              const axLat = rx * c0.nx + ry * c0.ny;
              if (axAlong < 6.0 && Math.abs(axLat) < hw0 + 24.0) {
                const qx = Math.max(0, -axAlong + rCap);
                const qy = Math.max(0, Math.abs(axLat) - (hw0 - rCap));
                const boxDist = Math.hypot(qx, qy) + Math.min(Math.max(-axAlong + rCap, Math.abs(axLat) - (hw0 - rCap)), 0) - rCap;
                if (axAlong < 0) {
                  sdf = Math.max(sdf, boxDist);
                }
                const capW = smoothstep(5.0, -1.5, axAlong);
                const mixNx = bnx * (1 - capW) - c0.tx * capW;
                const mixNy = bny * (1 - capW) - c0.ty * capW;
                const mLen = Math.hypot(mixNx, mixNy) || 1.0;
                bnx = mixNx / mLen;
                bny = mixNy / mLen;
              }
            }

            const bLen = Math.hypot(bnx, bny) || 1.0;
            bnx /= bLen;
            bny /= bLen;

            const uNorm = clamp01((u + 0.02) / 1.07);
            const sdfNorm = clamp01(0.5 - sdf / 18.0);
            out[o] = floatToHalf(uNorm);
            out[o + 1] = floatToHalf(sdfNorm);
            out[o + 2] = floatToHalf(clamp01(0.5 + 0.5 * bnx));
            out[o + 3] = floatToHalf(clamp01(0.5 + 0.5 * bny));
          }
        }
        return { size, data: out };
      }

      const canvas = document.getElementById("hero-gl-canvas");
      canvas.width = canvasW;
      canvas.height = canvasH;
      canvas.style.width = `${canvasW}px`;
      canvas.style.height = `${canvasH}px`;
      const gl = canvas.getContext("webgl2", {
        alpha: alphaBg,
        antialias: true,
        depth: false,
        stencil: false,
        premultipliedAlpha: alphaBg,
        preserveDrawingBuffer: true
      });

      const FULLSCREEN_VS = `#version 300 es
        precision highp float;
        in vec2 aPos;
        out vec2 vUv;
        void main() {
          vUv = aPos * 0.5 + 0.5;
          gl_Position = vec4(aPos, 0.0, 1.0);
        }
      `;

      function buildPillarLitGlsl() {
        return `
          vec3 evalPillarAt(vec2 uvN, vec2 gradX, vec2 gradY, out float outAlpha) {
            vec2 pUv = clamp(uvN + vec2(0.0, uPillarShiftY / 512.0), 0.0, 1.0);
            vec4 pCol = textureGrad(uPillarColorTex, pUv, gradX, gradY);
            vec4 pMeta = textureGrad(uPillarMetaTex, pUv, gradX, gradY);
            float sideMask = pMeta.r;
            float mainMask = pMeta.g;
            float spineMask = pMeta.b;
            float totalMask = clamp(sideMask + mainMask, 0.0, 1.0);

            float x512 = pUv.x * 512.0;
            float y512 = pUv.y * 512.0;
            float yNorm = clamp((y512 - 82.0) / 412.0, 0.0, 1.0);
            float faceProg = clamp((x512 - 225.0) / 145.0, 0.0, 1.0);
            float sideProg = clamp((245.0 - x512) / 95.0, 0.0, 1.0);
            float rakingFace = 1.0 - smoothstep(uLightSweep - 0.50, uLightSweep + 0.22, faceProg);
            float sideWave = smoothstep(0.0, 0.90, uPillarReveal);
            float faceWeight = mix(0.06, 1.0, rakingFace) * smoothstep(0.0, 0.85, uPillarReveal);

            // Crisp architectural silhouette contour detection (left slope + top crest + right slope)
            float eps1 = 1.75 / 512.0;
            float eps2 = 3.50 / 512.0;
            vec4 mL = textureGrad(uPillarMetaTex, clamp(pUv - vec2(eps1, 0.0), 0.0, 1.0), gradX, gradY);
            vec4 mR = textureGrad(uPillarMetaTex, clamp(pUv + vec2(eps1, 0.0), 0.0, 1.0), gradX, gradY);
            vec4 mU = textureGrad(uPillarMetaTex, clamp(pUv - vec2(0.0, eps1), 0.0, 1.0), gradX, gradY);
            vec4 mU2 = textureGrad(uPillarMetaTex, clamp(pUv - vec2(0.0, eps2), 0.0, 1.0), gradX, gradY);
            float leftEdge = clamp(sideMask - mL.r, 0.0, 1.0);
            float rightEdge = clamp(mainMask - mR.g, 0.0, 1.0);
            float topEdge = clamp(totalMask - min(clamp(mU.r + mU.g, 0.0, 1.0), clamp(mU2.r + mU2.g, 0.0, 1.0)), 0.0, 1.0);
            float silhouetteEdge = clamp(leftEdge + rightEdge + topEdge, 0.0, 1.0);
            float contourDropFade = 1.0 - smoothstep(335.0, 488.0, y512);

            vec3 col = pCol.rgb;
            if (uIsLight < 0.5) {
              // Starts pitch-black (0.0) and is gradually sculpted out of darkness by colored studio lights
              float bodyReveal = mix(sideWave, faceWeight, step(0.15, mainMask));
              col = pCol.rgb * bodyReveal;

              // Multi-hue sculptural studio lighting waves (cool cyan/sapphire -> warm coral/gold -> mint/violet -> white daylight clean-up)
              float dFace = 0.56 * faceProg + 0.44 * yNorm;
              float dBounce = 0.52 * (1.0 - faceProg) + 0.48 * (1.0 - yNorm);
              float dSide = 0.50 * sideProg + 0.50 * yNorm;
              float whiteClear = smoothstep(uWhiteSweep - 0.30, uWhiteSweep + 0.14, 1.0 - dFace);
              float chroma = uColorLightEnv * mix(1.0, 0.0, step(0.01, uWhiteSweep) * (1.0 - whiteClear));

              // Stage 1: Colored contour hairline rim catches silhouette out of complete black first
              float contourTrace = clamp(1.0 - smoothstep(uContourReveal * 1.18 - 0.28, uContourReveal * 1.18 + 0.05, yNorm), 0.0, 1.0)
                * smoothstep(0.0, 0.14, uContourReveal);
              vec3 leftRimCol = mix(vec3(0.16, 0.88, 1.00), vec3(0.68, 0.42, 1.00), smoothstep(0.10, 0.85, yNorm));
              vec3 rightRimCol = mix(vec3(1.00, 0.82, 0.36), vec3(1.00, 0.38, 0.68), smoothstep(0.12, 0.82, yNorm));
              vec3 topRimCol = vec3(0.56, 0.94, 1.00);
              vec3 contourCol = leftRimCol * leftEdge + rightRimCol * rightEdge + topRimCol * topEdge;
              float contourGlowMask = silhouetteEdge * contourTrace * contourDropFade * chroma;

              if (chroma > 0.001) {
                float bandA = exp(-pow((dFace - (uKeyWave1 * 1.38 - 0.18)) / 0.30, 2.0));
                float bandB = exp(-pow((dFace - (uKeyWave2 * 1.44 - 0.22)) / 0.30, 2.0));
                float bandC = exp(-pow((dBounce - (uKeyWave3 * 1.42 - 0.20)) / 0.32, 2.0));
                float bandS = exp(-pow((dSide - (uKeyWave1 * 1.25 - 0.10)) / 0.42, 2.0));

                vec3 colCool = mix(vec3(0.18, 0.72, 1.00), vec3(0.52, 0.94, 1.00), 1.0 - yNorm);
                vec3 colWarm = mix(vec3(1.00, 0.80, 0.34), vec3(1.00, 0.40, 0.68), smoothstep(0.15, 0.88, yNorm));
                vec3 colPrism = mix(vec3(0.16, 0.96, 0.78), vec3(0.74, 0.42, 1.00), smoothstep(0.15, 0.85, faceProg * 0.65 + (1.0 - yNorm) * 0.35));
                vec3 colSide = mix(vec3(0.18, 0.66, 1.00), vec3(0.76, 0.44, 1.00), smoothstep(0.15, 0.85, uKeyWave3));

                vec3 facetGlow = colCool * bandA * 1.05 + colWarm * bandB * 1.05 + colPrism * bandC * 1.02;
                float baseFadeMask = 1.0 - smoothstep(355.0, 492.0, y512);
                float lightIllumGate = smoothstep(0.02, 0.65, uContourReveal * 0.55 + uPillarReveal * 0.75);
                float mainStrength = mainMask * chroma * baseFadeMask * lightIllumGate;
                float sideStrength = sideMask * chroma * baseFadeMask * lightIllumGate;

                // Direct colored studio illumination raises plane luminance out of dark stone
                vec3 coloredPlaneHit = (pCol.rgb * 0.55 + vec3(0.20)) * facetGlow;
                col = mix(col, max(col, coloredPlaneHit) + facetGlow * 0.18 * rakingFace, clamp(mainStrength * 0.88 * (bandA + bandB + bandC), 0.0, 0.94));
                col += colSide * sideStrength * (0.16 + 0.34 * bandS + 0.26 * bandC) * smoothstep(0.0, 0.75, sideProg + 0.20);
                col += contourCol * contourGlowMask * 0.72;
              }
            } else {
              float revealTone = mix(0.25, 1.0, max(sideWave * sideMask, faceWeight * mainMask));
              col = mix(pCol.rgb * 0.55 + vec3(0.38), pCol.rgb, revealTone);
            }

            float spineProg = 1.0 - smoothstep(uSpineHeadY - 32.0, uSpineHeadY + 14.0, y512);
            float dySpine = (y512 - uSpineHeadY) / 18.0;
            float spinePulse = exp(-(dySpine * dySpine)) * uSpineGlow;
            float spineStrength = spineMask * max(spineProg * 0.96, spinePulse * 1.35) * smoothstep(0.0, 0.08, uContourReveal);
            float topFade = 1.0 - smoothstep(110.0, 492.0, y512);
            vec3 spineHue = mix(uSpineColor, mix(vec3(0.28, 0.92, 1.00), mix(vec3(1.00, 0.78, 0.38), vec3(0.76, 0.48, 1.00), smoothstep(0.25, 0.82, yNorm)), smoothstep(0.04, 0.52, yNorm)), uColorLightEnv * 0.94);
            col = mix(col, spineHue, clamp(spineStrength, 0.0, 0.98) * topFade);

            outAlpha = uIsLight < 0.5
              ? pCol.a
              : clamp(pCol.a * mix(0.44, 1.0, max(sideWave, faceWeight)), 0.0, 1.0);
            return col;
          }
        `;
      }

      const PASS1_BG_FS = `#version 300 es
        precision highp float;
        in vec2 vUv;
        out vec4 fragColor;

        uniform sampler2D uSkyTex;
        uniform sampler2D uPillarColorTex;
        uniform sampler2D uPillarMetaTex;
        uniform vec3 uStageGround;
        uniform float uIsBare;
        uniform float uIsLight;
        uniform float uStageReveal;
        uniform float uSkyReveal;
        uniform float uContourReveal;
        uniform float uPillarReveal;
        uniform float uLightSweep;
        uniform float uPillarShiftY;
        uniform float uSpineHeadY;
        uniform float uSpineGlow;
        uniform vec3 uSpineColor;
        uniform float uColorLightEnv;
        uniform float uKeyWave1;
        uniform float uKeyWave2;
        uniform float uKeyWave3;
        uniform float uWhiteSweep;

        ${buildPillarLitGlsl()}

        void main() {
          vec2 uv = vUv;
          vec4 sky = texture(uSkyTex, uv);
          vec3 curGround = uIsLight < 0.5 ? mix(vec3(0.008, 0.009, 0.012), uStageGround, uStageReveal) : uStageGround;
          vec3 col = uIsBare < 0.5 ? mix(curGround, sky.rgb, sky.a * uSkyReveal) : curGround;
          float pAlpha = 0.0;
          vec3 pCol = evalPillarAt(uv, vec2(1.0 / 1024.0, 0.0), vec2(0.0, 1.0 / 1024.0), pAlpha);
          col = mix(col, pCol, pAlpha);
          fragColor = vec4(col, 1.0);
        }
      `;

      const PASS2_BLUR_FS = `#version 300 es
        precision highp float;
        in vec2 vUv;
        out vec4 fragColor;
        uniform sampler2D uSrcTex;
        uniform vec2 uDir;

        void main() {
          const float w0 = 0.14107;
          const float w1 = 0.13298;
          const float w2 = 0.11128;
          const float w3 = 0.08258;
          const float w4 = 0.05427;
          const float w5 = 0.03158;
          const float w6 = 0.01678;

          vec4 sum = texture(uSrcTex, clamp(vUv, 0.0, 1.0)) * w0;
          sum += (texture(uSrcTex, clamp(vUv + uDir * 1.0, 0.0, 1.0)) + texture(uSrcTex, clamp(vUv - uDir * 1.0, 0.0, 1.0))) * w1;
          sum += (texture(uSrcTex, clamp(vUv + uDir * 2.0, 0.0, 1.0)) + texture(uSrcTex, clamp(vUv - uDir * 2.0, 0.0, 1.0))) * w2;
          sum += (texture(uSrcTex, clamp(vUv + uDir * 3.0, 0.0, 1.0)) + texture(uSrcTex, clamp(vUv - uDir * 3.0, 0.0, 1.0))) * w3;
          sum += (texture(uSrcTex, clamp(vUv + uDir * 4.0, 0.0, 1.0)) + texture(uSrcTex, clamp(vUv - uDir * 4.0, 0.0, 1.0))) * w4;
          sum += (texture(uSrcTex, clamp(vUv + uDir * 5.0, 0.0, 1.0)) + texture(uSrcTex, clamp(vUv - uDir * 5.0, 0.0, 1.0))) * w5;
          sum += (texture(uSrcTex, clamp(vUv + uDir * 6.0, 0.0, 1.0)) + texture(uSrcTex, clamp(vUv - uDir * 6.0, 0.0, 1.0))) * w6;
          fragColor = sum;
        }
      `;

      const PASS3_MAIN_FS = `#version 300 es
        precision highp float;
        in vec2 vUv;
        out vec4 fragColor;

        uniform sampler2D uBgSharpTex;
        uniform sampler2D uBgBlurTex;
        uniform sampler2D uSkyTex;
        uniform sampler2D uRimTex;
        uniform sampler2D uPillarColorTex;
        uniform sampler2D uPillarMetaTex;
        uniform sampler2D uRearContactTex;
        uniform sampler2D uRibbonShadeTex;
        uniform sampler2D uRibbonMaskTex;
        uniform sampler2D uRibbonFieldTex;
        uniform sampler2D uOfficialTex;

        uniform vec2 uViewportPx;
        uniform vec2 uStageRadii;
        uniform float uStageOffsetY;
        uniform float uSettledScale;
        uniform float uAlphaBg;
        uniform float uLensClip;
        uniform vec2 uHeroCenterPx;
        uniform float uHeroScalePx;
        uniform vec2 uFocus512;
        uniform vec3 uStageCenter;
        uniform vec3 uStageEdge;
        uniform float uIsBare;
        uniform float uIsLight;
        uniform float uStageReveal;
        uniform float uSkyReveal;

        uniform float uUHead;
        uniform float uLeadHead;
        uniform float uRibSpeed;
        uniform float uDispPhase;
        uniform float uChromaEnv;
        uniform float uGlassMix;
        uniform float uShadowStrength;
        uniform float uFloorShadowOpacity;
        uniform float uSpecStrength;
        uniform vec3 uSpecColor;
        uniform float uRimProgress;
        uniform float uRimBoost;
        uniform float uSheenPos;
        uniform float uSheenStrength;
        uniform float uContourReveal;
        uniform float uPillarReveal;
        uniform float uPillarShiftY;
        uniform float uLightSweep;
        uniform float uSpineHeadY;
        uniform float uSpineGlow;
        uniform vec3 uSpineColor;
        uniform float uColorLightEnv;
        uniform float uKeyWave1;
        uniform float uKeyWave2;
        uniform float uKeyWave3;
        uniform float uWhiteSweep;
        uniform float uSettleBlend;

        ${buildPillarLitGlsl()}

        float ign(vec2 p) {
          return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
        }

        void evalRibbonTip(vec4 field, float uHead, out float tipCov, out float tipPinchClip, out float dFromTip, out float latSide) {
          float u = -0.02 + 1.07 * field.r;
          float sdfPx = (0.5 - field.g) * 18.0;
          vec2 nRaw = vec2(field.b, field.a) * 2.0 - 1.0;
          vec2 nBevel = length(nRaw) > 1e-4 ? nRaw / length(nRaw) : vec2(0.0, -1.0);

          float uC = clamp(u, 0.0, 1.0);
          float aT = -2.2 + 4.6 * uC;
          vec2 dRib = vec2(-920.0 * sin(aT) - 525.0 * uC * uC, 1680.0 * uC * (1.0 - uC));
          vec2 tanT = normalize(dRib);
          vec2 normT = vec2(-tanT.y, tanT.x);
          latSide = clamp(dot(nBevel, normT), -1.0, 1.0);

          // Bold swept calligraphic blade cut across curve during emergence, settling smoothly before lower-left mist fade
          float bladeScale = smoothstep(0.01, 0.14, uHead) * (1.0 - smoothstep(0.94, 1.08, uHead));
          float edgeLag = smoothstep(-14.0, -1.0, sdfPx);
          float uSculpt = u + bladeScale * (0.056 * latSide + 0.024 * edgeLag * edgeLag);

          dFromTip = uHead - uSculpt;
          tipCov = 1.0 - smoothstep(uHead - 0.040, uHead + 0.004, uSculpt);

          // Hydrodynamic liquid taper at advancing prow
          float tipProg = clamp(dFromTip / 0.16, 0.0, 1.0);
          float pinchPx = 9.2 * pow(1.0 - tipProg, 1.85) * bladeScale;
          float pinchGate = clamp(pinchPx / 0.35, 0.0, 1.0);
          tipPinchClip = mix(1.0, 1.0 - smoothstep(-pinchPx - 1.4, -pinchPx + 0.45, sdfPx), pinchGate);
        }

        void main() {
          vec2 screenPx = vec2(gl_FragCoord.x, uViewportPx.y - gl_FragCoord.y);
          vec2 screenUvN = screenPx / uViewportPx;
          vec2 screenUv512 = screenUvN * 512.0;

          vec2 dStage = (screenPx - vec2(uHeroCenterPx.x, uHeroCenterPx.y - uStageOffsetY)) / uStageRadii;
          float stageRadial = smoothstep(0.0, 1.25, length(dStage));
          vec3 darkVoid = vec3(0.008, 0.009, 0.012);
          vec3 curStageCenter = uIsLight < 0.5 ? mix(darkVoid, uStageCenter, uStageReveal) : uStageCenter;
          vec3 curStageEdge = uIsLight < 0.5 ? mix(darkVoid * 0.5, uStageEdge, uStageReveal) : uStageEdge;
          vec3 stageCol = mix(curStageCenter, curStageEdge, stageRadial);

          vec2 uv512 = ((screenPx - uHeroCenterPx) / uHeroScalePx) * 512.0 + uFocus512;
          vec2 uvN = uv512 / 512.0;

          if (uIsBare < 0.5 && uLensClip < 0.5) {
            vec2 shRel = uv512 - vec2(256.0, 276.0);
            float softBox = 1.0 - smoothstep(180.0, 286.0, length(max(abs(shRel) - vec2(115.0, 115.0), 0.0)));
            float shVis = (1.0 - smoothstep(1.02, 1.45, uHeroScalePx / max(uSettledScale, 1.0))) * uStageReveal;
            stageCol = mix(stageCol, stageCol * (uIsLight > 0.5 ? 0.72 : 0.25), softBox * uFloorShadowOpacity * 0.45 * shVis);
          }

          bool insideBox = (uvN.x >= 0.0 && uvN.x <= 1.0 && uvN.y >= 0.0 && uvN.y <= 1.0);
          if (!insideBox && uLensClip < 0.5) {
            float dither = (ign(gl_FragCoord.xy) - 0.5) / 255.0;
            fragColor = vec4(clamp(stageCol + dither, 0.0, 1.0), 1.0);
            return;
          }
          uvN = clamp(uvN, 0.0, 1.0);
          uv512 = uvN * 512.0;

          vec2 uvGradX = vec2(1.0 / max(uHeroScalePx, 1.0), 0.0);
          vec2 uvGradY = vec2(0.0, 1.0 / max(uHeroScalePx, 1.0));
          vec4 screenOfficial = texture(uOfficialTex, screenUvN);
          vec2 skyUvN = uLensClip > 0.5 ? (uvN * 0.9941406 + 0.0029297) : uvN;
          vec2 skyGradX = uLensClip > 0.5 ? uvGradX * 0.9941406 : uvGradX;
          vec2 skyGradY = uLensClip > 0.5 ? uvGradY * 0.9941406 : uvGradY;
          vec4 skyTex = textureGrad(uSkyTex, skyUvN, skyGradX, skyGradY);
          float lensMask = uLensClip > 0.5 ? screenOfficial.a : skyTex.a;
          float sqAlpha = uIsBare > 0.5 ? 0.0 : lensMask;

          // Sky base (clean single layer; straight RGB inside transparent lens to eliminate border halo)
          vec3 skyStraight = skyTex.a > 0.004 ? clamp(skyTex.rgb / skyTex.a, 0.0, 1.0) : skyTex.rgb;
          vec3 baseStageOrSky;
          if (uAlphaBg > 0.5 && uLensClip > 0.5) {
            baseStageOrSky = mix(darkVoid, skyStraight, uSkyReveal);
          } else {
            baseStageOrSky = uIsBare < 0.5 ? mix(stageCol, mix(stageCol, skyStraight, uSkyReveal), sqAlpha) : stageCol;
          }
          float lowerPAlpha = 0.0;
          vec3 lowerPCol = evalPillarAt(uvN, uvGradX, uvGradY, lowerPAlpha);

          // Dynamic foreground drop shadow cast onto lower pillar/sky (respecting sculpted prow & mist fade)
          vec2 shRibbonUv = clamp(uvN - vec2(0.0, 9.5 / 512.0), 0.0, 1.0);
          vec4 fieldSh = texture(uRibbonFieldTex, shRibbonUv);
          float sdfSh = (0.5 - fieldSh.g) * 18.0;
          float shU = -0.02 + 1.07 * fieldSh.r;
          float tipSh, pinchSh, dTipSh, latSh;
          evalRibbonTip(fieldSh, uUHead - 0.008, tipSh, pinchSh, dTipSh, latSh);
          float yInflSh = smoothstep(266.0, 326.0, uv512.y);
          float projMist = clamp(((uv512.x - 195.0) * -171.0 + (uv512.y - 365.0) * 53.0) / 32050.0, 0.0, 1.0);
          float mistFadeSh = 1.0 - yInflSh * (1.0 - pow(1.0 - smoothstep(0.0, 1.0, projMist) + 1e-5, 1.6));
          float ribbonShadow = (1.0 - smoothstep(-1.5, 8.0, sdfSh)) * tipSh * pinchSh * smoothstep(0.30, 0.54, shU) * mistFadeSh;

          // Live Optical Liquid Glass Ribbon + Leading Trajectory Prism Filament + Chromatic Edge Dispersion
          vec4 f = texture(uRibbonFieldTex, uvN);
          float rMask = textureGrad(uRibbonMaskTex, uvN, uvGradX, uvGradY).a;
          float uArc = -0.02 + 1.07 * f.r;
          float tipCov, tipPinchClip, dFromTip, latSide;
          evalRibbonTip(f, uUHead, tipCov, tipPinchClip, dFromTip, latSide);
          float ribbonCov = clamp(rMask * tipCov * tipPinchClip, 0.0, 1.0);

          float sdfPx = (0.5 - f.g) * 18.0;
          float leadWindow = (1.0 - smoothstep(uLeadHead - 0.045, uLeadHead + 0.004, uArc)) * smoothstep(uUHead - 0.085, uUHead + 0.008, uArc);
          float railCore = smoothstep(-0.15, 0.85, -sdfPx) * (1.0 - smoothstep(1.25, 2.75, -sdfPx));
          float railAura = smoothstep(-0.3, 1.6, -sdfPx) * (1.0 - smoothstep(2.4, 5.4, -sdfPx));
          float leadActive = smoothstep(-0.01, 0.07, uLeadHead) * (1.0 - smoothstep(0.92, 1.08, uUHead));
          float leadCov = clamp(rMask * leadWindow * (railCore * 0.98 + railAura * 0.34) * leadActive, 0.0, 1.0);
          float totalRibCov = max(ribbonCov, leadCov);

          vec3 ribbonColor = vec3(0.0);
          vec3 leadColor = vec3(0.0);
          vec3 leadAdd = vec3(0.0);
          if (totalRibCov > 0.001) {
            vec2 nRaw = vec2(f.b, f.a) * 2.0 - 1.0;
            float nLen = length(nRaw);
            vec2 nBevel = nLen > 1e-4 ? nRaw / nLen : vec2(0.0, -1.0);

            float flowFast = uArc * 20.0 - uDispPhase * 17.0 + latSide * 1.5;
            float flowMed = uArc * 12.0 - uDispPhase * 11.0 - latSide * 1.1;
            float flowTravel = pow(0.5 + 0.5 * sin(uArc * 14.0 - uDispPhase * 14.5), 2.0);
            float wCyan = pow(0.5 + 0.5 * sin(flowFast), 1.4);
            float wCoral = pow(0.5 + 0.5 * sin(flowFast + 2.094), 1.4);
            float wViolet = pow(0.5 + 0.5 * sin(flowMed + 4.188), 1.35);
            float wGold = pow(0.5 + 0.5 * sin(flowMed + 1.05), 1.35);

            vec3 coolFringe = vec3(0.08, 0.98, 1.00) * (0.55 + 0.90 * wCyan) + vec3(0.72, 0.38, 1.00) * (0.42 + 0.72 * wViolet);
            vec3 warmFringe = vec3(1.00, 0.30, 0.68) * (0.55 + 0.88 * wCoral) + vec3(1.00, 0.86, 0.22) * (0.40 + 0.70 * wGold);
            float sideSplit = clamp(0.5 + 0.54 * latSide, 0.0, 1.0);
            vec3 edgeSpectrum = mix(coolFringe, warmFringe, sideSplit) * (0.88 + 0.34 * flowTravel);

            if (leadCov > 0.001) {
              float leadHeadGlow = exp(-pow(max(0.0, uLeadHead - uArc) / 0.065, 2.0));
              vec3 leadBase = mix(edgeSpectrum, vec3(0.96, 0.99, 1.00), 0.42 * leadHeadGlow);
              leadColor = clamp(leadBase * (1.05 + 0.85 * leadHeadGlow) * (0.85 * railCore + 0.42 * railAura), 0.0, 1.0);
              leadAdd = edgeSpectrum * (0.88 * railCore + 0.24 * railAura) * (0.78 + 0.95 * leadHeadGlow) * rMask * leadWindow * leadActive * uChromaEnv;
            }

            if (ribbonCov > 0.001) {
              float bevelBand = exp(-max(0.0, -sdfPx) / 3.4);
              float activeEnvelope = smoothstep(0.0, 0.14, uUHead) * (1.0 - smoothstep(0.94, 1.08, uUHead));
              float wakeBand = exp(-pow(max(0.0, dFromTip) / 0.17, 2.0)) * smoothstep(-0.02, 0.015, dFromTip) * activeEnvelope;
              float crescentRim = exp(-pow((dFromTip - 0.005) / 0.018, 2.0)) * activeEnvelope;

              // Spatial optical RGB dispersion across bevel wavelengths
              float refrBasePx = (-5.8 - 2.8 * wakeBand) * bevelBand;
              float dispSpreadPx = (2.8 + 3.0 * wakeBand) * uChromaEnv * (0.35 + 0.65 * bevelBand);
              vec2 refrUvR = clamp(uvN + nBevel * ((refrBasePx - dispSpreadPx) / 512.0), 0.0, 1.0);
              vec2 refrUvG = clamp(uvN + nBevel * (refrBasePx / 512.0), 0.0, 1.0);
              vec2 refrUvB = clamp(uvN + nBevel * ((refrBasePx + dispSpreadPx) / 512.0), 0.0, 1.0);

              vec3 blurRefr = vec3(
                texture(uBgBlurTex, refrUvR).r,
                texture(uBgBlurTex, refrUvG).g,
                texture(uBgBlurTex, refrUvB).b
              );
              vec3 sharpDisp = vec3(
                texture(uBgSharpTex, refrUvR).r,
                texture(uBgSharpTex, refrUvG).g,
                texture(uBgSharpTex, refrUvB).b
              );
              vec3 blurCenter = texture(uBgBlurTex, uvN).rgb;
              vec3 bodyCol = textureGrad(uRibbonShadeTex, uvN, uvGradX, uvGradY).rgb;

              // Calibrated frosted optical glass + luminous prism refraction differential
              float refrWeight = mix(0.08, 0.42, smoothstep(0.28, 0.78, uArc));
              vec3 blurTint = uIsLight < 0.5 ? clamp(blurRefr * 0.88 + vec3(0.11), 0.0, 1.0) : clamp(blurRefr * 0.72 + vec3(0.16), 0.0, 1.0);
              vec3 sharpFringe = (sharpDisp - vec3(sharpDisp.g)) * bevelBand * uChromaEnv * 0.88;
              vec3 refractedGlass = mix(bodyCol, blurTint, refrWeight) + (blurRefr - blurCenter) * 0.50 * bevelBand + sharpFringe;

              // Crisp 1.5px luminous RGB edge flow + delicate inner bevel caustic (bright yet razor-fine across entire active sweep)
              float innerLip = smoothstep(1.2, 3.2, -sdfPx) * (1.0 - smoothstep(3.2, 8.2, -sdfPx));
              float fineRim = smoothstep(-0.1, 0.9, -sdfPx) * (1.0 - smoothstep(1.6, 3.6, -sdfPx));
              float innerCaustic = smoothstep(1.4, 3.0, -sdfPx) * (1.0 - smoothstep(3.6, 7.2, -sdfPx));
              vec2 keyDir = normalize(vec2(-0.62, -0.78));
              float dKey = max(0.0, dot(-nBevel, keyDir));
              float dRim = max(0.0, dot(nBevel, vec2(0.45, 0.89)));
              float directionalSpec = pow(dKey + 1e-4, 1.8) * 0.72 + pow(dRim + 1e-4, 2.4) * 0.25;

              float dSheen = (diagCoord - uSheenPos) / 0.085;
              float sheenBand = exp(-(dSheen * dSheen)) * uSheenStrength;

              float speedBoost = 0.45 + 0.55 * clamp(uRibSpeed, 0.0, 1.35);
              float sustainedWake = exp(-pow(max(0.0, dFromTip) / 0.48, 2.0)) * activeEnvelope;
              float edgeWeight = fineRim * 0.96 + innerCaustic * 0.44;
              float dispGain = uChromaEnv * (0.58 * speedBoost + 0.65 * wakeBand + 0.48 * sustainedWake) * edgeWeight;
              vec3 tipGlowCol = (vec3(0.95, 0.99, 1.0) * 0.46 + edgeSpectrum * 0.88) * (crescentRim * (0.36 + 0.88 * fineRim) + wakeBand * 0.26 * innerCaustic) * uChromaEnv;

              float totalSpec = innerLip * (directionalSpec * uSpecStrength * 0.48 + sheenBand * 1.18) + sheenBand * 0.22;
              vec3 baseGlassSpec = clamp(refractedGlass + uSpecColor * totalSpec, 0.0, 1.0);
              vec3 chromaticTintTarget = clamp(baseGlassSpec * (vec3(0.66) + 0.62 * edgeSpectrum) + edgeSpectrum * (0.76 * fineRim + 0.36 * innerCaustic), 0.0, 1.0);
              vec3 rimAdditive = edgeSpectrum * (fineRim * (0.52 + 0.62 * wakeBand + 0.38 * sustainedWake) + innerCaustic * 0.16 * sustainedWake) * uChromaEnv;
              ribbonColor = clamp(mix(baseGlassSpec, chromaticTintTarget, clamp(dispGain * 1.40, 0.0, 0.94)) + tipGlowCol + rimAdditive, 0.0, 1.0);
            }
          }

          vec3 ribLayerCol = mix(leadColor, ribbonColor, smoothstep(0.0, 0.35, ribbonCov));

          // True single-pass painter's order per zone (guarantees pillar is blended ONCE everywhere, ZERO y=270 seam)
          float behindProg = smoothstep(0.05, 0.26, max(uUHead, uLeadHead));
          vec4 rearAO = textureGrad(uRearContactTex, uvN, uvGradX, uvGradY);
          vec3 ribBehind = mix(ribLayerCol, ribLayerCol * (1.0 - 0.56 * rearAO.a), behindProg);
          vec3 colUpper = mix(baseStageOrSky, ribBehind, totalRibCov) + leadAdd * (1.0 - 0.48 * rearAO.a);
          colUpper = mix(colUpper, lowerPCol, lowerPAlpha);

          vec3 colLower = mix(baseStageOrSky, lowerPCol, lowerPAlpha);
          colLower = mix(colLower, colLower * (uIsLight > 0.5 ? 0.50 : 0.15), ribbonShadow * uShadowStrength);
          colLower = mix(colLower, ribLayerCol, totalRibCov) + leadAdd;

          float isFrontZone = smoothstep(225.0, 252.0, uv512.y);
          vec3 glassLayer = mix(colUpper, colLower, isFrontZone);

          // Squircle 1px Precision Rim Trace (badge only, crisp colorful trace out of black converging to B&W)
          vec3 finalIcon = glassLayer;
          if (uIsBare < 0.5) {
            vec2 rimUvN = uLensClip > 0.5 ? (screenUvN * 0.9941406 + 0.0029297) : uvN;
            vec2 rimGradX = uLensClip > 0.5 ? vec2(0.9941406 / max(uViewportPx.x, 1.0), 0.0) : uvGradX;
            vec2 rimGradY = uLensClip > 0.5 ? vec2(0.0, 0.9941406 / max(uViewportPx.y, 1.0)) : uvGradY;
            vec2 rim512 = uLensClip > 0.5 ? screenUv512 : uv512;
            vec4 rimTex = textureGrad(uRimTex, rimUvN, rimGradX, rimGradY);
            float rimMaskWeight = uAlphaBg > 0.5 ? 1.0 : sqAlpha;
            float ang = atan(rim512.y - 256.0 + 1e-5, rim512.x - 256.0);
            float angDelta = abs(mod(ang + 2.3561945 + 3.14159265, 6.2831853) - 3.14159265) / 3.14159265;
            float rimVis = clamp(1.0 - smoothstep(uRimProgress - 0.14, uRimProgress + 0.03, angDelta), 0.0, 1.0) * smoothstep(-0.15, 0.04, uRimProgress);
            float dRimLead = (angDelta - uRimProgress) / 0.075;
            float rimLead = exp(-(dRimLead * dRimLead)) * uRimBoost;
            float dShSheen = (0.68 * rimUvN.x + 0.44 * rimUvN.y - uSheenPos) / 0.10;
            float shoulderSheen = exp(-(dShSheen * dShSheen)) * uSheenStrength * 1.4;
            vec3 rimPrism = mix(vec3(0.18, 0.94, 1.0), vec3(0.92, 0.44, 1.0), 0.5 + 0.5 * sin(ang * 2.0 - uDispPhase * 5.0));
            vec3 rimTint = mix(rimTex.rgb, rimPrism, 0.72 * clamp(rimLead, 0.0, 1.0) * uChromaEnv);
            finalIcon = clamp(finalIcon + rimTint * rimTex.a * (rimVis * 0.96 + rimLead * 1.15 + shoulderSheen) * rimMaskWeight, 0.0, 1.0);
          }

          // Seamless parity lock onto verified official 1024px Composer master
          vec4 offTex = uLensClip > 0.5 ? screenOfficial : texture(uOfficialTex, uvN);
          vec3 offStraight = (uLensClip > 0.5 && offTex.a > 0.004) ? clamp(offTex.rgb / offTex.a, 0.0, 1.0) : offTex.rgb;
          vec3 outCol;
          if (uAlphaBg > 0.5 && uLensClip > 0.5) {
            if (sqAlpha <= 0.001) {
              fragColor = vec4(0.0);
              return;
            }
            outCol = mix(finalIcon, offStraight, uSettleBlend);
            float dither = (ign(gl_FragCoord.xy) - 0.5) / 255.0;
            vec3 dithered = clamp(outCol + dither * sqAlpha, 0.0, 1.0);
            fragColor = vec4(dithered * sqAlpha, sqAlpha);
            return;
          } else if (uIsBare < 0.5) {
            vec3 offOverStage = mix(stageCol, offStraight, sqAlpha);
            outCol = mix(finalIcon, offOverStage, uSettleBlend);
          } else {
            vec3 offOverStage = stageCol * (1.0 - offTex.a) + offTex.rgb * offTex.a;
            outCol = mix(finalIcon, offOverStage, uSettleBlend);
          }

          float dither = (ign(gl_FragCoord.xy) - 0.5) / 255.0;
          fragColor = vec4(clamp(outCol + dither, 0.0, 1.0), 1.0);

      `;

      function compileShader(label, type, src) {
        if (!gl || gl.isContextLost()) {
          throw new Error("WebGL2 context unavailable/lost before compiling " + label);
        }
        const s = gl.createShader(type);
        if (!s) {
          throw new Error("createShader returned null for " + label + " (err=" + gl.getError() + ")");
        }
        gl.shaderSource(s, src);
        gl.compileShader(s);
        const compiled = gl.getShaderParameter(s, gl.COMPILE_STATUS);
        if (!compiled) {
          const log = gl.getShaderInfoLog(s);
          const gotSrc = gl.getShaderSource(s) || "";
          const ver = gl.getParameter(gl.VERSION);
          const ren = gl.getParameter(gl.RENDERER);
          throw new Error(
            "Shader compile error [" + label + "]: status=" + String(compiled) +
            " ver=" + String(ver) + " ren=" + String(ren) +
            " err=" + gl.getError() + " lost=" + gl.isContextLost() +
            " srcLen=" + gotSrc.length + " head=" + JSON.stringify(gotSrc.slice(0, 70)) +
            " log=" + JSON.stringify(log)
          );
        }
        return s;
      }

      function linkProgram(label, vsSrc, fsSrc) {
        const p = gl.createProgram();
        gl.attachShader(p, compileShader(label + "_VS", gl.VERTEX_SHADER, vsSrc));
        gl.attachShader(p, compileShader(label + "_FS", gl.FRAGMENT_SHADER, fsSrc));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
          throw new Error("Program link error [" + label + "]: " + gl.getProgramInfoLog(p));
        }
        return p;
      }

      function makeTextureFromSource(source, mipmap = false) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mipmap ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        if (mipmap) gl.generateMipmap(gl.TEXTURE_2D);
        return tex;
      }

      function makeTextureFromBytes(width, height, bytes) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        if (bytes instanceof Uint16Array) {
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, width, height, 0, gl.RGBA, gl.HALF_FLOAT, bytes);
        } else {
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
        }
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return tex;
      }

      function makeFbo(size) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);

      let ready = false;
      let lastDrawnTime = -999;
      let resources = null;

      function renderAt(tRaw) {
        if (!ready || !resources) return;
        const t = Math.max(0, Math.min(DURATION, Number(tRaw) || 0));
        if (Math.abs(t - lastDrawnTime) < 1e-6) return;
        lastDrawnTime = t;

        const camSample = sampleCamCurve(t / 3.32);
        const baseScale = settledScale;
        const heroScalePx = baseScale * lerp(1.50, 1.0, camSample.u);
        const focus512 = [lerp(258.0, 256.0, camSample.u), lerp(198.0, 256.0, camSample.u)];

        let centerX = canvasW * 0.5;
        let centerY = canvasH * 0.5;
        if (wordmarkMode === "below") {
          centerY = lerp(canvasH * 0.5, canvasH * (456.0 / 1080.0), smoothstep(1.90, 3.05, t));
        } else if (wordmarkMode === "beside") {
          centerX = lerp(canvasW * 0.5, canvasW * (675.0 / 1920.0), easeInOutQuart(clamp01((t - 2.05) / 1.05)));
        }

        const stageReveal = T.isLight ? 1.0 : smoothstep(0.01, 0.68, t);
        const contourReveal = easeOutCubic(clamp01((t - 0.01) / 0.56));
        const pPillar = clamp01((t - 0.12) / 1.05);
        const pillarReveal = easeBalanced(pPillar);
        const lightSweep = lerp(-0.24, 1.38, easeBalanced(clamp01((t - 0.14) / 1.45)));
        const pillarShiftY = lerp(18.0, 0.0, easeAiryOut(clamp01((t - 0.04) / 1.05)));

        const pSpine = clamp01((t - 0.03) / 0.58);
        const spineHeadY = lerp(92.0, 508.0, easeSnapOut(pSpine));
        const spineGlow = smoothstep(0.0, 0.10, pSpine) * (1.0 - smoothstep(0.35, 0.78, t))
          + 0.65 * Math.exp(-Math.pow((t - 1.72) / 0.28, 2));

        const colorLightEnv = (0.72 + 0.28 * smoothstep(0.01, 0.18, t)) * (1.0 - smootherstep(2.55, 3.40, t));
        const keyWave1 = easeBalanced(clamp01((t - 0.01) / 1.15));
        const keyWave2 = easeMidSweep(clamp01((t - 0.45) / 1.35));
        const keyWave3 = easeMidSweep(clamp01((t - 0.95) / 1.55));
        const whiteSweep = clamp01((t - 2.38) / 1.02) * 1.18;

        const ribSample = sampleRibbonCurve(pRib);
        const uHead = lerp(-0.025, 1.10, ribSample.u);

        const chromaEnv = smoothstep(0.16, 0.36, t) * (1.0 - smootherstep(2.68, 3.42, t));

        const skyReveal = easeBalanced(clamp01((t - 0.15) / 1.00));

        gl.viewport(0, 0, r.fboBg.size, r.fboBg.size);
        gl.useProgram(r.p1);
        bindTex(r.p1, "uSkyTex", 0, r.texSky);
        bindTex(r.p1, "uPillarColorTex", 1, r.texPillarCol);
        bindTex(r.p1, "uPillarMetaTex", 2, r.texPillarMeta);
        gl.uniform3fv(gl.getUniformLocation(r.p1, "uStageGround"), T.stageCenter);
        gl.uniform1f(gl.getUniformLocation(r.p1, "uIsBare"), vesselMode === "bare" ? 1.0 : 0.0);
        gl.uniform1f(gl.getUniformLocation(r.p1, "uIsLight"), T.isLight ? 1.0 : 0.0);
        gl.uniform1f(gl.getUniformLocation(r.p1, "uStageReveal"), stageReveal);
        gl.uniform1f(gl.getUniformLocation(r.p1, "uSkyReveal"), skyReveal);
        gl.uniform1f(gl.getUniformLocation(r.p1, "uContourReveal"), contourReveal);
        gl.uniform1f(gl.getUniformLocation(r.p1, "uPillarReveal"), pillarReveal);
        gl.uniform1f(gl.getUniformLocation(r.p1, "uLightSweep"), lightSweep);
        gl.uniform1f(gl.getUniformLocation(r.p1, "uPillarShiftY"), pillarShiftY);
        gl.uniform1f(gl.getUniformLocation(r.p1, "uSpineHeadY"), spineHeadY);
        gl.uniform1f(gl.getUniformLocation(r.p1, "uSpineGlow"), spineGlow);

        gl.uniform1f(gl.getUniformLocation(r.p1, "uKeyWave1"), keyWave1);

        gl.bindFramebuffer(gl.FRAMEBUFFER, r.fboBlurA.fbo);
        gl.viewport(0, 0, r.fboBlurA.size, r.fboBlurA.size);
        bindTex(r.p2, "uSrcTex", 0, r.fboBg.tex);
        gl.uniform2f(gl.getUniformLocation(r.p2, "uDir"), 1.65 / r.fboBlurA.size, 0.0);

        gl.bindFramebuffer(gl.FRAMEBUFFER, r.fboBlurB.fbo);
        bindTex(r.p2, "uSrcTex", 0, r.fboBlurA.tex);
        gl.uniform2f(gl.getUniformLocation(r.p2, "uDir"), 0.0, 1.65 / r.fboBlurB.size);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        const stageRadii = isStageDefault ? [880.0, 660.0] : [canvasW * 0.56, canvasH * 0.56];
        const stageOffsetY = isStageDefault ? 40.0 : canvasH * 0.035;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvasW, canvasH);

        gl.useProgram(r.p3);
        bindTex(r.p3, "uBgSharpTex", 0, r.fboBg.tex);

        bindTex(r.p3, "uSkyTex", 2, r.texSky);
        bindTex(r.p3, "uRimTex", 3, r.texRim);
        bindTex(r.p3, "uPillarColorTex", 4, r.texPillarCol);
        bindTex(r.p3, "uPillarMetaTex", 5, r.texPillarMeta);
        bindTex(r.p3, "uRearContactTex", 6, r.texRearAO);
        bindTex(r.p3, "uRibbonShadeTex", 7, r.texRibbonShade);
        bindTex(r.p3, "uRibbonMaskTex", 8, r.texRibbonMask);
        bindTex(r.p3, "uRibbonFieldTex", 9, r.texRibbonField);
        bindTex(r.p3, "uOfficialTex", 10, r.texOfficial);

        gl.uniform2f(gl.getUniformLocation(r.p3, "uViewportPx"), canvasW, canvasH);
        gl.uniform2f(gl.getUniformLocation(r.p3, "uStageRadii"), stageRadii[0], stageRadii[1]);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uStageOffsetY"), stageOffsetY);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uSettledScale"), settledScale);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uAlphaBg"), alphaBg ? 1.0 : 0.0);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uLensClip"), lensClip ? 1.0 : 0.0);
        gl.uniform2f(gl.getUniformLocation(r.p3, "uHeroCenterPx"), centerX, centerY);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uHeroScalePx"), heroScalePx);
        gl.uniform2fv(gl.getUniformLocation(r.p3, "uFocus512"), focus512);
        gl.uniform3fv(gl.getUniformLocation(r.p3, "uStageCenter"), T.stageCenter);
        gl.uniform3fv(gl.getUniformLocation(r.p3, "uStageEdge"), T.stageEdge);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uIsBare"), vesselMode === "bare" ? 1.0 : 0.0);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uIsLight"), T.isLight ? 1.0 : 0.0);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uStageReveal"), stageReveal);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uSkyReveal"), skyReveal);

        gl.uniform1f(gl.getUniformLocation(r.p3, "uUHead"), uHead);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uLeadHead"), leadHead);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uRibSpeed"), ribSpeed);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uDispPhase"), dispPhase);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uChromaEnv"), chromaEnv);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uGlassMix"), T.glassMix);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uShadowStrength"), T.shadowStrength);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uFloorShadowOpacity"), T.floorShadowOpacity);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uSpecStrength"), T.specularStrength);
        gl.uniform3fv(gl.getUniformLocation(r.p3, "uSpecColor"), T.specularColor);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uRimProgress"), rimProgress);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uRimBoost"), rimBoost);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uSheenPos"), sheenPos);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uSheenStrength"), sheenStrength);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uContourReveal"), contourReveal);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uPillarReveal"), pillarReveal);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uPillarShiftY"), pillarShiftY);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uLightSweep"), lightSweep);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uSpineHeadY"), spineHeadY);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uSpineGlow"), spineGlow);
        gl.uniform3fv(gl.getUniformLocation(r.p3, "uSpineColor"), T.spineGlintColor);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uColorLightEnv"), colorLightEnv);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uKeyWave1"), keyWave1);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uKeyWave2"), keyWave2);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uKeyWave3"), keyWave3);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uWhiteSweep"), whiteSweep);
        gl.uniform1f(gl.getUniformLocation(r.p3, "uSettleBlend"), settleBlend);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.finish();
      }

      async function setupAndRegister() {
        const officialSrc = vesselMode === "bare" ? T.officialBare : T.officialBadge;

        const [
          skyImg,
          rimImg,
          pillarColImg,
          pillarMetaImg,
          rearAOImg,
          ribbonShadeImg,
          ribbonMaskImg,
          officialImg
        ] = await Promise.all([
          loadImage(svgDataUrl(buildSkyInteriorSvg())),
          loadImage(svgDataUrl(buildSquircleRimSvg())),
          loadImage(svgDataUrl(buildPillarColorSvg())),
          loadImage(svgDataUrl(buildPillarMetaSvg())),
          loadImage(svgDataUrl(buildRearContactSvg())),
          loadImage(svgDataUrl(T.ribbonSvg)),
          loadImage(svgDataUrl(buildRibbonMaskSvg())),
          loadImage(officialSrc),
          document.fonts.ready
        ]);

        const S = 1536;
        const drawToSquare = (img, box = [0, 0, 512, 512]) => {
          const c = document.createElement("canvas");
          c.width = S;
          c.height = S;
          const ctx = c.getContext("2d");
          const scale = S / 512;
          ctx.drawImage(img, box[0] * scale, box[1] * scale, box[2] * scale, box[3] * scale);
          return c;
        };

        const ribbonShadeCan = drawToSquare(ribbonShadeImg, [-76, 120, 550, 365]);
        applyLowerLeftFadeCanvas(ribbonShadeCan);
        const ribbonMaskCan = drawToSquare(ribbonMaskImg, [0, 0, 512, 512]);
        applyLowerLeftFadeCanvas(ribbonMaskCan);

        const fieldBuf = buildRibbonFieldBuffer(1024);

        const p1 = linkProgram("PASS1", FULLSCREEN_VS, PASS1_BG_FS);
        const p2 = linkProgram("PASS2", FULLSCREEN_VS, PASS2_BLUR_FS);
        const p3 = linkProgram("PASS3", FULLSCREEN_VS, PASS3_MAIN_FS);

        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        for (const p of [p1, p2, p3]) {
          const loc = gl.getAttribLocation(p, "aPos");
          gl.enableVertexAttribArray(loc);
          gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        }

        resources = {
          vao,
          p1,
          p2,
          p3,
          fboBg: makeFbo(1024),
          fboBlurA: makeFbo(512),
          fboBlurB: makeFbo(512),
          texSky: makeTextureFromSource(skyImg, true),
          texRim: makeTextureFromSource(rimImg, true),
          texPillarCol: makeTextureFromSource(pillarColImg, true),
          texPillarMeta: makeTextureFromSource(pillarMetaImg, true),
          texRearAO: makeTextureFromSource(rearAOImg, true),
          texRibbonShade: makeTextureFromSource(ribbonShadeCan, true),
          texRibbonMask: makeTextureFromSource(ribbonMaskCan, true),
          texRibbonField: makeTextureFromBytes(fieldBuf.size, fieldBuf.size, fieldBuf.data),
          texOfficial: makeTextureFromSource(officialImg, false)
        };

        ready = true;
        renderAt(0);

        const state = { time: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(state, {
          time: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: () => renderAt(state.time)
        }, 0);

        if (wordmarkMode !== "none") {
          tl.fromTo(
            "#brand-wordmark-wrap",
            { opacity: 0, filter: "blur(8px)" },
            { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" },
            2.55
          );
        }

        window.__timelines = window.__timelines || {};
        window.__timelines[COMP_ID] = tl;
        tl.seek(0);
      }

      window.addEventListener("hf-seek", (e) => {
        renderAt(e && e.detail ? e.detail.time : 0);
      });

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady[COMP_ID] = setupAndRegister();
    })();
  </script>
</template>
