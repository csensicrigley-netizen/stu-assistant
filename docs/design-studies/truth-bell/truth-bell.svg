      <path fill="url(#sky)" d="M0 0H512V512H0Z"/>
      <path fill="url(#cool-reflection)" d="M0 0H512V512H0Z"/>
      <path fill="url(#warm-reflection)" d="M0 0H512V512H0Z"/>
      <rect class="fine-detail" width="512" height="512" filter="url(#enamel-grain)" opacity=".081" style="mix-blend-mode:soft-light"/>
    </g>
    <use href="#plate" transform="translate(.6 .65) scale(.99766 .9855)" stroke="url(#perimeter)" stroke-width="1.25"/>
    <path d="M54 498 C76 507.6 106 508.0 150 508.0H362 C404 508.0 435 506.9 460 496.4"
      stroke="url(#bottom-reflex)" stroke-width=".92" stroke-linecap="round"/>
  </g>

  <g id="landmark" transform="translate(6 8)">
