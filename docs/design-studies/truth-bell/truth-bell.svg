<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <title>汕头大学真理钟</title>
  <desc>暮色青绿的底板上，石塔立在金属弧的转折处。梁从塔前挑起铜钟，越过左端后收在塔脚后方。</desc>
  <defs>
    <path id="plate" d="M148 0H364
      C414 0 438 0 461 12.3 C478.1 21.45 490.55 33.9 499.7 51 C512 74 512 98 512 148V364
      C512 414 512 438 499.7 461 C490.55 478.1 478.1 490.55 461 499.7 C438 512 414 512 364 512H148
      C98 512 74 512 51 499.7 C33.9 490.55 21.45 478.1 12.3 461 C0 438 0 414 0 364V148
      C0 98 0 74 12.3 51 C21.45 33.9 33.9 21.45 51 12.3 C74 0 98 0 148 0Z"/>
    <!-- The two cubics on each edge match tangent and curvature at the western turn. -->
    <path id="metal-arc" d="M427 111.8
      C258 111.8 82 201 82 297 C82 372 189.422 398 409.0 424.2
      Q414.3 424.86 415.3 424.72 Q416.5 424.48 414.84 423.89 Q412.4 422.95 409.2 422.15
      C185.84 389.2 107 357.7 107 296.5 C107 208.5 270 128.6 424.1 128.35
      Q427.1 128.3 428.8 126.9 L431.1 124.9 Q432 124.1 432.1 122.8 L432.5 114.1
      Q432.6 112 430.5 111.9Z"/>
    <path id="stele" d="M177.4 85.6Q177.4 83.8 179.3 83.45L219.9 75.7
      Q222.0 75.25 224 75.81L241.5 80.17 Q243.7 80.76 243.72 82.87L244.6 414.3
      Q244.6 416.15 242.8 416.9L224.1 423.64Q222.0 424.4 220.1 424.15L180.0 419.75
      Q177.75 419.5 177.75 417.28Z"/>
    <path id="stele-front" d="M176.6 84.4L222.24 76.0L222.05 425.5L176.65 420.10Z"/>
    <path id="bell-body" d="M348 189.4
      C333.2 189.4 324.2 198.4 321.55 211.1
      C316.3 236.25 315.7 261.9 308.7 285.4 C306.7 292.2 303.6 296.65 299.1 303.7
      C296.9 307.05 297.65 309.54 300.82 311.35
      C319.6 322.12 374.7 322.62 394.76 312.1 C398.17 310.31 399.2 307.24 397.05 303.97
      C392.74 297.16 389.33 292.05 387.35 285.65 C379.86 261.49 378.41 236.6 374.6 211.65
      C372.6 198.65 363.2 189.4 348 189.4Z"/>
    <clipPath id="face-clip"><use href="#plate" transform="translate(.6 .65) scale(.99766 .9855)"/></clipPath>
    <clipPath id="pier-clip"><use href="#stele"/></clipPath>
    <clipPath id="front-clip"><use href="#stele-front"/></clipPath>
    <clipPath id="ribbon-clip"><use href="#metal-arc"/></clipPath>
    <clipPath id="upper"><path d="M164 57H255V237H164Z"/></clipPath>
    <clipPath id="lower"><path d="M163 337H270V436H163Z"/></clipPath>
    <mask id="beam-behind-foot" maskUnits="userSpaceOnUse" x="65" y="65" width="390" height="390">
      <rect x="65" y="65" width="390" height="390" fill="white"/>
      <g clip-path="url(#lower)"><use href="#stele" fill="black"/></g>
    </mask>
    <clipPath id="bell-clip"><use href="#bell-body"/></clipPath>
    <linearGradient id="plate-edge" gradientUnits="userSpaceOnUse" x1="65" y1="4" x2="390" y2="526">
