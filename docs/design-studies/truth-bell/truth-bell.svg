          C192.7 392.1 99.5 359.5 99.5 296.0 C99.5 209.0 267.6 124.65 426.1 124.02
          Q429.6 123.9 431.9 122.1 L434.4 118.5Z" fill="url(#ribbon-face)"/>
        <path d="M83.1 294.6 C83.8 201.0 260.3 112.8 425.7 112.72
          C261.5 116.0 92.8 203.4 83.1 294.6Z" fill="url(#top-ridge)"/>
        <path d="M100.9 299.1 C104.2 359.0 199.6 392.5 408.3 423.0
          C199.5 391.0 107.1 358.8 100.9 299.1Z" fill="url(#tail-ridge)"/>
        <path class="fine-detail" d="M426.4 112L432.3 112.4L432.05 123.0L428.5 126.0L429.3 115.7
          Q429.4 113.1 426.4 112Z" fill="#a89c7c" opacity=".55"/>
      </g>
    </g>
    <style>
      .small-detail { display:none }
      @media (max-width: 48px) {
        .fine-detail { display:none }
        .small-detail { display:inline }
        #bell-body-small-edge { stroke:#c8a675; stroke-width:2.4 }
        #sling-light { stroke-width:5 }
      }
    </style>
