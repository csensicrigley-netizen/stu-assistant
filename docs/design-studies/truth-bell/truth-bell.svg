        Q351 197.4 352.3 193.6L367.1 125" stroke="#37504a" stroke-linejoin="round" stroke-linecap="round" stroke-width="6.1"/>
      <path id="sling-light" d="M329.2 134.0L343.0 192.9Q344.2 195.7 347.5 195.7 Q350.3 195.7 351.4 192.7L366.1 125.0"
        stroke="url(#suspension-metal)" stroke-linejoin="round" stroke-linecap="round" stroke-width="4.15"/>
      <path transform="translate(0 13)" fill-rule="evenodd" d="M337.5 192.6V185.8C337.5 178.4 341.3 173.4 347.3 173.4
        C353.8 173.4 358 178.6 358 185.9V192.6Z M342.4 190.1H352.8V185.7C352.8 181.3 350.5 177.9 347.5 177.9
        C344.3 177.9 342.4 181.4 342.4 185.8Z" fill="url(#suspension-metal)"/>
    </g>
    <g id="stone-tower">
