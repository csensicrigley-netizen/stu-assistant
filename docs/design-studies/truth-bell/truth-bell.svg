      <stop offset=".65" stop-color="#b8c7b4"/><stop offset=".85" stop-color="#d2d0b4"/><stop offset="1" stop-color="#dbceb0"/>
    </linearGradient>
    <linearGradient id="top-ridge" gradientUnits="userSpaceOnUse" x1="95" y1="295" x2="383" y2="105">
