      <stop offset=".62" stop-color="#233e3b"/><stop offset=".88" stop-color="#172d2e"/><stop offset="1" stop-color="#263f3c"/>
    </linearGradient>
    <linearGradient id="enamel" gradientUnits="userSpaceOnUse" x1="131" y1="4" x2="370" y2="514">
      <stop stop-color="#365b55"/><stop offset=".39" stop-color="#234a45"/>
      <stop offset=".78" stop-color="#163934"/><stop offset="1" stop-color="#112b30"/>
    </linearGradient>
    <radialGradient id="sky" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(146 24) rotate(24) scale(314 241)">
      <stop stop-color="#b8b7a0" stop-opacity=".33"/><stop offset=".5" stop-color="#8ea896" stop-opacity=".17"/><stop offset="1" stop-color="#78988d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool-reflection" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(7 370) rotate(-27) scale(308 167)">
