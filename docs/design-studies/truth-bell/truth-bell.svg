          <use href="#metal-arc" transform="translate(1.35 2.2)" fill="#384b40" opacity=".32"/>
        </g>
      </g>
    </g>
    <g mask="url(#beam-behind-foot)">
      <use href="#beam"/>
      <g clip-path="url(#ribbon-clip)">
        <use class="small-detail" href="#small-arc-return" stroke="#afc1a4" stroke-width="5.5"/>
        <g clip-path="url(#lower)">
