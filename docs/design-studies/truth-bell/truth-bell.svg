    </radialGradient>
    <radialGradient id="warm-reflection" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(462 528) rotate(-24) scale(236 143)">
      <stop stop-color="#ad976c" stop-opacity=".25"/><stop offset=".55" stop-color="#93896b" stop-opacity=".10"/><stop offset="1" stop-color="#748271" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="perimeter" gradientUnits="userSpaceOnUse" x1="40" y1="5" x2="410" y2="487">
      <stop stop-color="#f2ecce" stop-opacity=".49"/><stop offset=".41" stop-color="#b9c6b1" stop-opacity=".1"/>
      <stop offset=".72" stop-color="#0d302f" stop-opacity=".48"/><stop offset="1" stop-color="#d2d1b4" stop-opacity=".17"/>
    </linearGradient>
    <linearGradient id="bottom-reflex" gradientUnits="userSpaceOnUse" x1="67" y1="501" x2="445" y2="501">
      <stop stop-color="#90a398" stop-opacity="0"/><stop offset=".30" stop-color="#a3b0a3" stop-opacity=".21"/>
      <stop offset=".65" stop-color="#aeb2a3" stop-opacity=".27"/><stop offset="1" stop-color="#aea088" stop-opacity="0"/>
