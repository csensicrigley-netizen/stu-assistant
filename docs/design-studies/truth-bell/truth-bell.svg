        <path class="fine-detail" d="M305.8 287.8C327.8 295.35 368.3 295.6 389.1 288.5" stroke="#f5d69c" stroke-opacity=".86" stroke-width="1.25"/>
        <path d="M296.9 307.8 C313.5 296.0 379.3 295.4 397.6 307.6
