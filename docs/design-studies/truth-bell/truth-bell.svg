      <g clip-path="url(#pier-clip)">
        <use href="#stele-front" fill="url(#stone)"/>
        <path d="M177 83.2L221.9 74.7L245.2 80.7L222.1 79.4L177 87.4Z" fill="url(#stone-cap)"/>
        <path d="M178.08 89.2L178.35 416.2" stroke="#e1e7cf" stroke-opacity=".42" stroke-width="1.15"/>
        <path d="M222.2 80.1L222.1 422.3" stroke="url(#stone-arris)" stroke-width="1.27"/>
        <g class="fine-detail" clip-path="url(#front-clip)" stroke-linecap="round">
          <path d="M176 242.3L198.8 241.3 M203.1 245.5L223.5 244.6 M176.3 324.1L193.4 324.6 M205.3 347.9L224.9 348.8"
            stroke="#708c80" stroke-width="1.05" opacity=".72"/>
          <path d="M176 243.6L198.8 242.6 M203.1 246.8L223.5 245.9 M205.3 349.1L225 350.0" stroke="#f1efdc" stroke-width=".8" opacity=".5"/>
          <path d="M182.8 295.6L199.8 295.8 M208.1 116.2L224.2 113.9" stroke="#738d7e" stroke-width=".75" opacity=".38"/>
        </g>
        <g clip-path="url(#upper)">
