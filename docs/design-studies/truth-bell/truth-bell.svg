    <linearGradient id="tail-ridge" gradientUnits="userSpaceOnUse" x1="104" y1="288" x2="404" y2="425">
      <stop stop-color="#a7c5af" stop-opacity=".40"/><stop offset=".34" stop-color="#698e7d" stop-opacity=".13"/><stop offset=".70" stop-color="#c0c3a5" stop-opacity=".61"/><stop offset="1" stop-color="#c7c1a0" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="stone" gradientUnits="userSpaceOnUse" x1="171" y1="84" x2="247" y2="408">
      <stop stop-color="#d4d5c5"/><stop offset=".34" stop-color="#c6ccbb"/><stop offset=".78" stop-color="#bac6b7"/><stop offset="1" stop-color="#adbdaf"/>
