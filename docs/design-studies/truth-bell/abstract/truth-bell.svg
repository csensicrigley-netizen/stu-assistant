      C512 414 512 438 499.7 461 C490.55 478.1 478.1 490.55 461 499.7 C438 512 414 512 364 512H148
      C98 512 74 512 51 499.7 C33.9 490.55 21.45 478.1 12.3 461 C0 438 0 414 0 364V148
      C0 98 0 74 12.3 51 C21.45 33.9 33.9 21.45 51 12.3 C74 0 98 0 148 0Z"/>
    <clipPath id="trim"><use href="#outline"/></clipPath>
    <linearGradient id="field" gradientUnits="userSpaceOnUse" x1="65" y1="479" x2="407" y2="-29">
      <stop stop-color="#21625E"/><stop offset=".28" stop-color="#235952"/>
      <stop offset=".63" stop-color="#204740"/><stop offset="1" stop-color="#152F36"/>
    </linearGradient>
    <radialGradient id="sage" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(58 18) rotate(37) scale(420 296)">
      <stop stop-color="#B8B393" stop-opacity=".53"/>
      <stop offset=".49" stop-color="#8EAA88" stop-opacity=".30"/><stop offset="1" stop-color="#708C75" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(532 393) rotate(-31) scale(368 193)">
      <stop stop-color="#0F2433" stop-opacity=".81"/><stop offset=".50" stop-color="#153C42" stop-opacity=".40"/>
      <stop offset="1" stop-color="#294D4A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tide" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(56 572) rotate(-19) scale(372 164)">
      <stop stop-color="#729B91" stop-opacity=".47"/><stop offset=".52" stop-color="#4D837C" stop-opacity=".24"/><stop offset="1" stop-color="#527C72" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="6" y1="36" x2="487" y2="476">
      <stop stop-color="#B8C5AB"/><stop offset=".22" stop-color="#9AB4A0"/><stop offset=".52" stop-color="#75968A"/>
