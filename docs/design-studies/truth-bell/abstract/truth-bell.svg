      <path d="M0 0H512V512H0Z" fill="url(#blue)"/>
      <path d="M0 0H512V512H0Z" fill="url(#tide)"/>
      <use href="#outline" stroke="url(#rim)" stroke-width="17.2"/>
      <use href="#outline" transform="translate(6.5 6.5) scale(.974609375)" stroke="url(#rim-fold)" stroke-width="3.7"/>
      <use href="#outline" transform="translate(1.25 1.25) scale(.9951171875)" stroke="url(#rim-light)" stroke-width="1.65"/>
      <use href="#outline" stroke="#142D30" stroke-opacity=".45" stroke-width="1.12"/>
    </g>
  </g>
  <g id="mark" fill="#F5EBCF" transform="translate(12 -4)">
    <path d="M406 122
      C282 146 183 211 169 276
