      <stop stop-color="#14263C" stop-opacity=".81"/><stop offset=".50" stop-color="#153C42" stop-opacity=".40"/>
      <stop offset="1" stop-color="#294D4A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tide" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(56 572) rotate(-19) scale(372 164)">
      <stop stop-color="#729B91" stop-opacity=".47"/><stop offset=".52" stop-color="#4D837C" stop-opacity=".24"/><stop offset="1" stop-color="#527C72" stop-opacity="0"/>
