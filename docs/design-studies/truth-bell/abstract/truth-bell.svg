    </radialGradient>
  </defs>
  <g id="tile">
    <use href="#outline" fill="url(#field)"/>
    <g clip-path="url(#trim)">
      <path d="M0 0H512V512H0Z" fill="url(#sage)"/>
      <path d="M0 0H512V512H0Z" fill="url(#blue)"/>
      <path d="M0 0H512V512H0Z" fill="url(#tide)"/>
