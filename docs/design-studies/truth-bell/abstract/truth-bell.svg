      <stop stop-color="#66827A"/><stop offset=".35" stop-color="#5B7E76"/>
      <stop offset=".68" stop-color="#66897B"/><stop offset="1" stop-color="#92A590"/>
    </linearGradient>
    <linearGradient id="rim-light" gradientUnits="userSpaceOnUse" x1="66" y1="8" x2="411" y2="494">
      <stop stop-color="#E4E1BE" stop-opacity=".73"/><stop offset=".28" stop-color="#CBDFC1" stop-opacity=".63"/>
      <stop offset=".59" stop-color="#C1D5C1" stop-opacity=".35"/><stop offset="1" stop-color="#D8CFAC" stop-opacity=".61"/>
