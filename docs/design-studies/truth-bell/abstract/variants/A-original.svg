      C241.82 388.974 217.764 382.627 197.756 373.258
      C177.749 363.89 161.79 351.501 151.266 335.966
      C140.742 320.431 135.652 301.75 136.55 282.725
      C137.448 263.7 144.334 244.331 156.85 225.56
      C169.365 206.788 187.512 188.616 211.541 172.792
      C235.57 156.969 265.483 143.495 301.361 133.9
      C337.239 124.304 379.083 118.586 427.015 118.33
      Q429.8 118.9 427.985 120.27Z"/>
    <circle cx="344" cy="244.3" r="43" fill="url(#dot-coral)"/>
