    <radialGradient id="upper-warm" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(84 42) rotate(20) scale(330 266)">
      <stop stop-color="#FBF6EA" stop-opacity=".73"/><stop offset=".48" stop-color="#F5EEDA" stop-opacity=".39"/>
