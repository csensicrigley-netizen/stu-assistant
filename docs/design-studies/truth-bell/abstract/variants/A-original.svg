    </radialGradient>
    <radialGradient id="lower-pearl" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(519 458) rotate(-28) scale(310 194)">
      <stop stop-color="#CCD0D3" stop-opacity=".55"/><stop offset=".48" stop-color="#DADBD9" stop-opacity=".29"/>
      <stop offset="1" stop-color="#DADBD9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sand" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(18 545) rotate(-18) scale(331 176)">
      <stop stop-color="#DDC7A2" stop-opacity=".56"/><stop offset=".55" stop-color="#E2D2B5" stop-opacity=".28"/>
      <stop offset="1" stop-color="#E2D2B5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="441" y1="13" x2="85" y2="505">
