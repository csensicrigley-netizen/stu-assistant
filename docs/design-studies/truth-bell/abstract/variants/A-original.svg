    <radialGradient id="rim-warm" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(75 30) rotate(16) scale(213 151)">
      <stop stop-color="#EBD3A1" stop-opacity=".85"/><stop offset=".55" stop-color="#E4CCA1" stop-opacity=".39"/>
      <stop offset="1" stop-color="#DDC59B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep-gold" gradientUnits="userSpaceOnUse" x1="384" y1="153" x2="190" y2="392">
      <stop stop-color="#F6B80A"/><stop offset=".22" stop-color="#FFC300"/>
      <stop offset=".46" stop-color="#F1AD0A"/><stop offset=".76" stop-color="#D9900C"/>
      <stop offset="1" stop-color="#B77C18"/>
    </linearGradient>
    <linearGradient id="dot-coral" gradientUnits="userSpaceOnUse" x1="310" y1="212" x2="371" y2="278">
      <stop stop-color="#FF7164"/><stop offset=".43" stop-color="#FA5151"/>
      <stop offset=".78" stop-color="#E94B50"/><stop offset="1" stop-color="#D1454B"/>
    </linearGradient>
  </defs>
  <g id="tile">
    <use href="#outline" fill="url(#field)"/>
    <g clip-path="url(#trim)">
      <path d="M0 0H512V512H0Z" fill="url(#upper-warm)"/>
      <path d="M0 0H512V512H0Z" fill="url(#lower-pearl)"/>
      <path d="M0 0H512V512H0Z" fill="url(#sand)"/>
      <!-- Two colours on the same clipped perimeter give this edge its 3.8 px inside width. -->
      <g id="edge" stroke-width="7.6">
        <use href="#outline" stroke="url(#rim)"/>
        <use href="#outline" stroke="url(#rim-warm)"/>
      </g>
    </g>
  </g>
  <g id="mark">
