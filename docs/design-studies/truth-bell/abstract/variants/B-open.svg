    </radialGradient>
  </defs>
  <g id="tile">
    <use href="#outline" fill="url(#field)"/>
    <g clip-path="url(#trim)">
      <path d="M0 0H512V512H0Z" fill="url(#sage)"/>
      <path d="M0 0H512V512H0Z" fill="url(#blue)"/>
      <path d="M0 0H512V512H0Z" fill="url(#tide)"/>
      <!-- Two colours on the same clipped perimeter give this edge its 2.9 px inside width. -->
      <g id="edge" stroke-width="5.8">
        <use href="#outline" stroke="url(#rim)"/>
        <use href="#outline" stroke="url(#rim-warm)"/>
      </g>
    </g>
