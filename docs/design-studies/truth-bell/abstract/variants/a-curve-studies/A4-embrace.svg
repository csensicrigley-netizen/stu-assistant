<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>汕大真理钟 · A4 环抱</title>
  <desc>左上为浅象牙色，向下过渡到杏砂色。金黄色回弧配珊瑚红悬点，细边环绕四周。两端略向红点收拢，开口更紧。</desc>
  <defs>
