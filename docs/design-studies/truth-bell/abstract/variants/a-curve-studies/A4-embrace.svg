    <radialGradient id="lower-cool" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(522 459) rotate(-26) scale(318 237)">
      <stop stop-color="#BA9490" stop-opacity=".69"/>
