    </radialGradient>
    <linearGradient id="sweep-gold" gradientUnits="userSpaceOnUse" x1="380" y1="118" x2="226" y2="392">
      <stop stop-color="#F5B400"/>
      <stop offset=".23" stop-color="#FFC300"/>
