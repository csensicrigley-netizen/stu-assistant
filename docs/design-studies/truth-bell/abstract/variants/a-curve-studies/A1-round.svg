  </defs>
  <g id="tile">
    <use href="#outline" fill="url(#field)"/>
    <g clip-path="url(#trim)">
      <path d="M0 0H512V512H0Z" fill="url(#upper-warm)"/>
      <path d="M0 0H512V512H0Z" fill="url(#lower-cool)"/>
      <path d="M0 0H512V512H0Z" fill="url(#lower-warm)"/>
      <!-- Two colours on the same clipped perimeter give this edge its 3.8 px inside width. -->
      <g id="edge" stroke-width="7.6">
        <use href="#outline" stroke="url(#rim)"/>
        <use href="#outline" stroke="url(#rim-warm)"/>
      </g>
    </g>
