# STU 事项助手限流 zone（http 块级，供 oyishi-icu.conf 引用）
# stu_page: 静态页 20r/s；stu_api: 业务接口 8r/s；stu_login: 注册/登录/重登 10r/m
limit_req_zone $binary_remote_addr zone=stu_page:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=stu_api:10m   rate=8r/s;
limit_req_zone $binary_remote_addr zone=stu_login:10m rate=10r/m;
# 每 IP 并发连接上限（配合 server 块 limit_conn stu_conn 30）
limit_conn_zone $binary_remote_addr zone=stu_conn:10m;
