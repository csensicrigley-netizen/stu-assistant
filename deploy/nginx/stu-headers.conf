# STU 事项助手安全响应头（2026-11-01 加固）
# 坑：nginx 里 location 只要出现一条 add_header，server 级 add_header 全部失效，
# 所以每个自带 add_header 的 location 都要再 include 一次本文件。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# script-src 的 sha256 是 index.html 内联主题引导脚本的哈希；
# 若以后改动那段内联脚本，必须同步重算（源码 web/index.html 45 行起）。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-YN64P135DFsqTEkc/mi88I7C57YbbX+UuI/ud7jkSv8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
