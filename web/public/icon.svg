<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 -3.5 32 32">
  <title>STU 事项助手 · 真理钟</title>
  <defs>
    <!-- The sweep and the hanging bell share one unbroken outline. -->
    <path id="sweep" d="M25.65 23.08
      C16.46 22.28 7.08 19.22 5.89 14.86
      C4.98 11.45 8.70 7.92 13.92 5.96
      C17.02 4.81 20.60 4.18 23.34 4.02
      V5.53
      L23.03 5.60
      C21.90 5.85 21.27 6.72 21.23 8.05
      L21.03 13.60
      Q21.01 14.02 21.44 13.95
      Q24.03 13.42 26.64 13.95
      Q27.06 14.02 27.04 13.60
      L26.84 8.05
      C26.78 6.72 26.15 5.87 25.05 5.61
      L24.76 5.53
      V3.96
      L26.50 3.89
      Q26.90 3.88 26.90 3.47
      V2.28
      Q26.90 1.89 26.49 1.89
      C21.18 1.73 16.71 2.25 12.54 3.80
      C6.52 6.00 2.64 10.04 3.30 14.68
      C4.06 20.09 12.09 23.66 25.57 23.72
      Q25.93 23.72 25.94 23.45
      Q25.97 23.14 25.65 23.08Z" />
    <path id="stone" d="M10.97 1.94
      Q10.97 1.58 11.34 1.52
      L15.42 .92
      Q15.84 .85 15.84 1.28
      V23.41
      Q15.84 23.78 15.46 23.83
      L11.40 24.33
      Q10.97 24.38 10.97 23.97Z" />
    <clipPath id="upper-arm">
      <rect x="8" y="-2" width="11" height="13.8" />
    </clipPath>
    <g id="truth-bell" fill="#FFF">
      <use href="#sweep" />
      <use href="#stone" fill="#B8D5FF" />
      <g clip-path="url(#upper-arm)"><use href="#sweep" /></g>
    </g>
    <!-- A cut below the upper arm keeps the overlap legible in one ink. -->
    <mask id="crossing" maskUnits="userSpaceOnUse" x="-0.5" y="-3.5" width="32" height="32">
      <rect x="-0.5" y="-3.5" width="32" height="32" fill="white" />
      <g clip-path="url(#upper-arm)">
        <use href="#sweep" transform="translate(0 1)" fill="black" />
      </g>
    </mask>
    <g id="themed-bell" fill="#FFF">
      <use href="#stone" mask="url(#crossing)" />
      <use href="#sweep" />
    </g>
  </defs>
  <rect id="tile" x="-0.5" y="-3.5" width="32" height="32" rx="7.2" fill="#2455DC" />
  <use id="mark" href="#truth-bell" />
</svg>
