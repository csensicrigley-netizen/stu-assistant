<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -4 33 33" fill="none">
  <title>STU 事项助手 · 真理钟</title>
  <!-- Editable launcher master. Platform rasters are generated by scripts/icons.mjs. -->
  <defs>
    <radialGradient id="dusk" cx=".13" cy=".03" r="1.22">
