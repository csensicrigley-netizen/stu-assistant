      C16.81 22.00 9.38 19.94 7.28 16.90 C5.96 14.94 6.49 12.41 8.94 10.25
      C12.71 6.92 19.24 5.07 26.58 4.82 Q27.02 4.81 27.01 4.40 L27.00 3.42
      Q26.99 3.02 26.55 2.98Z" />
