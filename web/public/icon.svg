        <use href="#arc-profile" stroke-linejoin="round" mask="url(#arc-outline)" stroke="#766EA6" fill="none" stroke-width="2" />
      </g>
      <g id="tower">
        <use href="#tower-profile" fill="url(#stone-side)" />
        <g clip-path="url(#stone-face)">
          <g filter="url(#edge-light)">
            <path d="M10.85 1.86 L15.95 1.04 V23.67 L10.85 23.04Z" fill="url(#stone-light)" />
          </g>
          <path d="M10.73 12.40L14.07 12.23 M13.16 16.35L16.00 16.40" fill="none" stroke-linecap="butt" stroke-width=".65" stroke="#CCC7E6" />
        </g>
        <use href="#tower-profile" stroke-linejoin="round" mask="url(#tower-outline)" stroke="#766EA6" fill="none" stroke-width="2" />
      </g>
      <g clip-path="url(#upper-crossing)">
        <use href="#ribbon" />
      </g>
      <g id="bell">
        <g filter="url(#edge-light)">
          <use href="#bell-profile" fill="url(#bell-metal)" />
        </g>
        <g clip-path="url(#bell-face)">
          <path d="M20.86 13.23 Q24.15 14.02 27.45 13.20 V16 H20.86Z" fill="#D9D4EC" />
          <path d="M21.02 14.88 Q24.15 13.88 27.36 14.88 V16 H21.02Z" fill="#5D4983" />
        </g>
        <use href="#bell-profile" stroke-linejoin="round" mask="url(#bell-outline)" stroke="#766EA6" fill="none" stroke-width="2" />
      </g>
    </g>
    <mask id="crossing-gap" maskUnits="userSpaceOnUse" x="-1" y="-4" width="33" height="33">
      <rect x="-1" y="-4" width="33" height="33" fill="white" />
      <g clip-path="url(#upper-crossing)">
        <use href="#arc-profile" fill="black" stroke="black" stroke-width="3.35" stroke-linejoin="round" />
      </g>
    </mask>
    <g id="themed-bell" fill="white" stroke="white" stroke-linejoin="round" stroke-linecap="round">
      <use href="#tower-profile" mask="url(#crossing-gap)" stroke-width="1.25" />
      <use href="#sling-profile" fill="none" stroke-width="1.2" />
      <use href="#arc-profile" stroke-width="1.25" />
      <use href="#bell-profile" stroke-width="1.25" />
    </g>
    <clipPath id="tile-clip"><use href="#tile" /></clipPath>
  </defs>
  <rect id="tile" x="-1" y="-4" width="33" height="33" rx="7.4" fill="url(#dusk)" />
  <g clip-path="url(#tile-clip)"><use href="#truth-bell" id="mark" /></g>
</svg>
