apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// Release signing lives outside the web project so it can never be bundled
// into the website: STU事项助手/android-signing/keystore.properties.
// Keep that folder backed up: every future update must be signed with it.
def signingProps = new Properties()
def signingFile = rootProject.file("../../android-signing/keystore.properties")
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}

android {
    namespace = "com.stuassistant.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                // relative to keystore.properties, so no absolute (non-ASCII) path is stored
                storeFile new File(signingFile.parentFile, signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    defaultConfig {
        applicationId "com.stuassistant.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Product version only. Capability probes have independent versions below.
        versionCode 55
        versionName "1.0.54"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // The native entry has no bundled web UI. Keep old assets on disk for
            // rollback, but exclude them through the Android asset merger itself.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!public:!capacitor.config.json:!capacitor.plugins.json:!native-bridge.js'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.gpuqa'
            versionNameSuffix '-gpuqa.1'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        // Full app for local verification; can coexist with the maintainer's release.
        haptics {
            initWith release
            debuggable false
            applicationIdSuffix '.haptics'
            versionNameSuffix '-native.1'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        // Standalone public-API capability probe, independent of accounts and app data.
        liveprobe {
            initWith release
            debuggable false
            applicationIdSuffix '.liveprobe'
            versionNameSuffix '-liveprobe.1'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        huaweiprobe {
            initWith liveprobe
            applicationIdSuffix '.huaweiprobe'
            versionNameSuffix '-huaweiprobe.1'
            matchingFallbacks = ['release']
        }
        vivoprobe {
            initWith liveprobe
            applicationIdSuffix '.vivoprobe'
            versionNameSuffix '-vivoprobe.1'
            matchingFallbacks = ['release']
        }
        vivoidentity {
            initWith liveprobe
            applicationIdSuffix '.vivoprobe'
            versionNameSuffix '-vivoidentity.1'
            matchingFallbacks = ['release']
        }
        vivomap {
            initWith vivoidentity
            matchingFallbacks = ['release']
        }
    }
}

// Probe versions are not product releases and never advance the web/update feed.
// Preserve delivered probe identities/codes while the product version evolves.
def probeVersionsFile = rootProject.file('../../deploy/probe-versions.json')
def probeCatalog = new groovy.json.JsonSlurper().parse(probeVersionsFile, 'UTF-8')
def probeVersions = probeCatalog.variants
def expectedProbePackages = [
    Liveprobe: 'com.stuassistant.app.liveprobe',
    Huaweiprobe: 'com.stuassistant.app.huaweiprobe',
    Vivoprobe: 'com.stuassistant.app.vivoprobe',
    Vivoidentity: 'com.stuassistant.app.vivoprobe',
    Vivomap: 'com.autonavi.minimap'
]
if (probeCatalog.schemaVersion != 1 || !(probeVersions instanceof Map) ||
        probeVersions.keySet() != expectedProbePackages.keySet()) {
    throw new GradleException('Invalid standalone probe version catalog')
}
probeVersions.each { key, value ->
    def suffix = key == 'Vivomap' ? 'vivoidentity' : key.toLowerCase(Locale.ROOT)
    if (value.applicationId != expectedProbePackages[key] || !(value.versionCode instanceof Integer) ||
            value.versionCode < 1 || value.versionCode > 2100000000 ||
            !(value.versionName ==~ /[\d.]+-${suffix}\.\d+/)) {
        throw new GradleException("Invalid standalone probe identity/version: $key")
    }
}
if (probeVersions.Vivoidentity.versionName != probeVersions.Vivomap.versionName ||
        probeVersions.Vivoidentity.versionCode != probeVersions.Vivomap.versionCode) {
    throw new GradleException('Vivo identity pair must share a probe version')
}
androidComponents {
    onVariants(selector().all()) { variant ->
        def probeVersion = probeVersions.find { key, value -> key.equalsIgnoreCase(variant.buildType) }?.value
        if (probeVersion) {
            variant.applicationId.set(probeVersion.applicationId)
            variant.outputs.each { output ->
                output.versionName.set(probeVersion.versionName)
                output.versionCode.set(probeVersion.versionCode as Integer)
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation 'androidx.compose.ui:ui:1.12.0'
    implementation 'androidx.compose.foundation:foundation:1.12.0'
    implementation 'io.github.kyant0:backdrop:2.0.1'
    implementation 'io.github.kyant0:shapes:1.2.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation files('libs/richtap-2.0.4-lite.aar')
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

apply from: 'capacitor.build.gradle'
apply from: 'release-validation.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
